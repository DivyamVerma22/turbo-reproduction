name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # CPU torch only: nothing in src/ requests a GPU, and the default index
        # pulls a multi-gigabyte CUDA build.
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -q

      - name: Smoke-check the reproduction script
        # 2 replications instead of App. A's 30 -- a runnability check, not a
        # reproduction. The script labels the deviation itself.
        run: python scripts/reproduce_minimal.py --replications 2
